<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Inspection Checklist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo"><i class="fas fa-home"></i> House Inspection</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="resetBtn">
                        <i class="fas fa-undo"></i> Reset All
                    </button>
                    <button class="btn btn-primary" id="generateReportBtn">
                        <i class="fas fa-file-pdf"></i> Generate Report
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Filter Section -->
            <section class="filter-section">
                <h2 class="section-title">Filter by Category</h2>
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-category="all">
                        <i class="fas fa-th"></i> All
                    </button>
                    <button class="filter-btn" data-category="documents">
                        <i class="fas fa-file-contract"></i> Documents
                    </button>
                    <button class="filter-btn" data-category="asbestos">
                        <i class="fas fa-exclamation-triangle"></i> Asbestos
                    </button>
                    <button class="filter-btn" data-category="renovation">
                        <i class="fas fa-tools"></i> Renovation
                    </button>
                    <button class="filter-btn" data-category="exterior">
                        <i class="fas fa-building"></i> Exterior
                    </button>
                    <button class="filter-btn" data-category="kitchen">
                        <i class="fas fa-utensils"></i> Kitchen
                    </button>
                    <button class="filter-btn" data-category="bathroom">
                        <i class="fas fa-bath"></i> Bathroom
                    </button>
                    <button class="filter-btn" data-category="bedroom">
                        <i class="fas fa-bed"></i> Bedroom
                    </button>
                    <button class="filter-btn" data-category="livingroom">
                        <i class="fas fa-couch"></i> Living Room
                    </button>
                    <button class="filter-btn" data-category="basement">
                        <i class="fas fa-dungeon"></i> Basement
                    </button>
                    <button class="filter-btn" data-category="attic">
                        <i class="fas fa-house-damage"></i> Attic
                    </button>
                    <button class="filter-btn" data-category="apartment">
                        <i class="fas fa-building"></i> Apartment
                    </button>
                    <button class="filter-btn" data-category="plumbing">
                        <i class="fas fa-tint"></i> Water
                    </button>
                    <button class="filter-btn" data-category="electrical">
                        <i class="fas fa-bolt"></i> Electrical
                    </button>
                    <button class="filter-btn" data-category="structural">
                        <i class="fas fa-hard-hat"></i> Structural
                    </button>
                    <button class="filter-btn" data-category="hvac">
                        <i class="fas fa-fan"></i> Heating
                    </button>
                </div>
            </section>

            <!-- Progress Section -->
            <section class="progress-section">
                <div class="progress-card">
                    <h3>Inspection Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-stats">
                        <span><strong id="checkedCount">0</strong> Checked</span>
                        <span><strong id="totalCount">0</strong> Total</span>
                        <span><strong id="percentComplete">0%</strong> Complete</span>
                    </div>
                </div>
            </section>

            <!-- Checklist Section -->
            <section class="checklist-section">
                <div id="checklistContainer"></div>
            </section>

            <!-- Global Notes Section -->
            <section class="notes-section">
                <div class="notes-card">
                    <h3><i class="fas fa-sticky-note"></i> General Notes</h3>
                    <textarea id="globalNotes" placeholder="Add general notes about the house inspection..."></textarea>
                </div>
            </section>
        </div>
    </main>

    <!-- Report Modal -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-file-alt"></i> Inspection Report</h2>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="reportContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="printReport">
                    <i class="fas fa-print"></i> Print Report
                </button>
                <button class="btn btn-primary" id="copyReport">
                    <i class="fas fa-copy"></i> Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
